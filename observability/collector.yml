extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  file_log:
    include:
      - /var/log/security/security-pdp.json
      - /var/log/security/security-pep.json
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes["@timestamp"]
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
        severity:
          parse_from: attributes.level
      - type: move
        from: attributes["service.name"]
        to: resource["service.name"]
      - type: move
        from: attributes["deployment.environment.name"]
        to: resource["deployment.environment.name"]
      - type: trace_parser
        if: 'attributes.traceId != nil and attributes.traceId != ""'
        trace_id:
          parse_from: attributes.traceId
        span_id:
          parse_from: attributes.spanId
  file_log/edge:
    include: [/var/log/security/security-edge.json]
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes["@timestamp"]
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
        severity:
          parse_from: attributes.level
      - type: add
        field: resource["service.name"]
        value: security-edge
      - type: add
        field: resource["deployment.environment.name"]
        value: ${env:DEPLOYMENT_ENVIRONMENT}
  # Audit log de Coraza (partes AKZ). HU-034: el timestamp es epoch en ns (transaction.unix_timestamp;
  # transaction.timestamp es "YYYY/MM/DD HH:MM:SS" y no es ISO) y una linea que no parsea se DESCARTA
  # (on_error: drop): nunca viaja cruda a Loki. Su pipeline propio (logs/edge_audit) es fail-closed.
  file_log/edge_audit:
    include: [/var/log/security/security-edge-audit.json]
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        on_error: drop
        timestamp:
          parse_from: attributes.transaction.unix_timestamp
          layout_type: epoch
          layout: ns
      - type: add
        field: resource["service.name"]
        value: security-edge
      - type: add
        field: resource["deployment.environment.name"]
        value: ${env:DEPLOYMENT_ENVIRONMENT}
  prometheus:
    config:
      scrape_configs:
        - job_name: security-pdp
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${env:PDP_METRICS_TARGET}"]
        - job_name: security-pep
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${env:PEP_METRICS_TARGET}"]
        - job_name: security-edge
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["edge:2019"]
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(status.message, "")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  # HU-034: proyeccion SANEADA del audit de Coraza. SUSTITUYE el cuerpo (la linea cruda lleva query,
  # client_ip y Matched Data) y deja los atributos en LISTA BLANCA (keep_keys + set; nada de delete_key:
  # lo que no se nombra no sale). error_mode: ignore para que una linea rara no envenene el lote; el orden
  # garantiza que set(body) y keep_keys corren siempre, asi un fallo de extraccion deja campos vacios y
  # nunca la linea cruda. correlationId lo controla el cliente: se sanea a [A-Za-z0-9._:-] y se acota a 128.
  transform/edge_audit_projection:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'set(log.cache["byMsg"],  SliceToMap(log.attributes["messages"], ["data","msg"], ["data","id"]))'
          - 'set(log.cache["detMsg"], SliceToMap(log.attributes["messages"], ["data","msg"], ["data","data"]))'
          - 'set(log.cache["logdata"], log.cache["detMsg"]["edge-detection"])'
          - 'delete_key(log.cache["byMsg"], "edge-detection") where log.cache["byMsg"] != nil'
          - 'delete_key(log.cache["byMsg"], "") where log.cache["byMsg"] != nil'
          - 'set(log.cache["score"], ExtractPatterns(log.cache["logdata"], "^anomaly_score=(?P<score>[0-9]+) ")["score"]) where log.cache["logdata"] != nil'
          - 'set(log.cache["cid"], ExtractPatterns(log.cache["logdata"], " correlationId=(?P<cid>.*)$")["cid"]) where log.cache["logdata"] != nil'
          - 'replace_pattern(log.cache["cid"], "[^A-Za-z0-9._:-]", "_") where log.cache["cid"] != nil'
          - 'set(log.cache["ids"], String(Values(log.cache["byMsg"]))) where log.cache["byMsg"] != nil'
          - 'replace_pattern(log.cache["ids"], "[][]", "") where log.cache["ids"] != nil'
          - 'set(log.cache["msgs"], String(Keys(log.cache["byMsg"]))) where log.cache["byMsg"] != nil'
          - 'replace_pattern(log.cache["msgs"], "^..|..$", "") where log.cache["msgs"] != nil'
          - 'replace_pattern(log.cache["msgs"], "\",\"", " | ") where log.cache["msgs"] != nil'
          - 'set(log.cache["main"], ExtractPatterns(log.cache["ids"], "^(?:(?:949110|959100|980[0-9]{3}|100900),)*(?P<main>[0-9]+)")["main"]) where log.cache["ids"] != nil'
          - 'set(log.cache["main"], "") where log.cache["main"] != nil and IsMatch(log.cache["main"], "^(949110|959100|980[0-9]{3}|100900)$")'
          - 'set(log.cache["path"], Split(log.attributes["transaction"]["request"]["uri"], "?")[0])'
          - 'set(log.cache["method"], log.attributes["transaction"]["request"]["method"])'
          - 'set(log.cache["tid"], log.attributes["transaction"]["id"])'
          - 'set(log.cache["intr"], log.attributes["transaction"]["is_interrupted"])'
          - 'set(log.cache["f"], {"ids": log.cache["ids"], "msgs": log.cache["msgs"], "main": log.cache["main"], "score": log.cache["score"], "path": log.cache["path"], "method": log.cache["method"], "tid": log.cache["tid"]})'
          - 'truncate_all(log.cache["f"], 1024)'
          - 'set(log.cache["c"], {"cid": log.cache["cid"]})'
          - 'truncate_all(log.cache["c"], 128)'
          - 'set(log.body, {"correlationId": log.cache["c"]["cid"], "edge.rule_ids": log.cache["f"]["ids"], "edge.rule_msgs": log.cache["f"]["msgs"], "edge.rule_main": log.cache["f"]["main"], "edge.score": log.cache["f"]["score"], "edge.path": log.cache["f"]["path"], "edge.method": log.cache["f"]["method"], "edge.interrupted": log.cache["intr"], "edge.transaction_id": log.cache["f"]["tid"]})'
          - 'keep_keys(log.attributes, [])'
          - 'set(log.attributes["correlationId"], log.cache["c"]["cid"])'
          - 'set(log.attributes["edge.rule_ids"], log.cache["f"]["ids"])'
          - 'set(log.attributes["edge.rule_msgs"], log.cache["f"]["msgs"])'
          - 'set(log.attributes["edge.rule_main"], log.cache["f"]["main"])'
          - 'set(log.attributes["edge.score"], log.cache["f"]["score"])'
          - 'set(log.attributes["edge.path"], log.cache["f"]["path"])'
          - 'set(log.attributes["edge.method"], log.cache["f"]["method"])'
          - 'set(log.attributes["edge.interrupted"], log.cache["intr"])'
          - 'set(log.attributes["edge.transaction_id"], log.cache["f"]["tid"])'
  batch:
    timeout: 2s
    send_batch_size: 512
exporters:
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 300s
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 300s
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: false
service:
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/jaeger]
    logs:
      receivers: [file_log, file_log/edge, otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    # Pipeline propio e incondicional del audit del WAF (fail-closed por construccion, HU-034).
    logs/edge_audit:
      receivers: [file_log/edge_audit]
      processors: [memory_limiter, transform/edge_audit_projection, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
