extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  file_log:
    include:
      - /var/log/security/security-pdp.json
      - /var/log/security/security-pep.json
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes["@timestamp"]
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
        severity:
          parse_from: attributes.level
      - type: move
        from: attributes["service.name"]
        to: resource["service.name"]
      - type: move
        from: attributes["deployment.environment.name"]
        to: resource["deployment.environment.name"]
      - type: trace_parser
        if: 'attributes.traceId != nil and attributes.traceId != ""'
        trace_id:
          parse_from: attributes.traceId
        span_id:
          parse_from: attributes.spanId
  file_log/edge:
    include: [/var/log/security/security-edge.json]
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes["@timestamp"]
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
        severity:
          parse_from: attributes.level
      - type: add
        field: resource["service.name"]
        value: security-edge
      - type: add
        field: resource["deployment.environment.name"]
        value: ${env:DEPLOYMENT_ENVIRONMENT}
  file_log/edge_audit:
    include: [/var/log/security/security-edge-audit.json]
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.transaction.timestamp
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
      - type: add
        field: resource["service.name"]
        value: security-edge
      - type: add
        field: resource["deployment.environment.name"]
        value: ${env:DEPLOYMENT_ENVIRONMENT}
  prometheus:
    config:
      scrape_configs:
        - job_name: security-pdp
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${env:PDP_METRICS_TARGET}"]
        - job_name: security-pep
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${env:PEP_METRICS_TARGET}"]
        - job_name: security-edge
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["edge:2019"]
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(status.message, "")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  transform/edge_audit_privacy:
    error_mode: propagate
    log_statements:
      - context: log
        conditions:
          - attributes["transaction"] != nil
        statements:
          - set(attributes["correlationId"], attributes["transaction"]["request"]["headers"]["x-correlation-id"][0]) where attributes["transaction"]["request"]["headers"]["x-correlation-id"] != nil
          - set(attributes["correlationId"], attributes["transaction"]["request"]["headers"]["X-Correlation-Id"][0]) where attributes["transaction"]["request"]["headers"]["X-Correlation-Id"] != nil
          - set(attributes["edge.detection"], true) where attributes["messages"] != nil
          - delete_key(attributes, "messages")
          - delete_key(attributes["transaction"], "request")
          - delete_key(attributes["transaction"], "response")
          - delete_key(attributes["transaction"], "client_ip")
          - delete_key(attributes["transaction"], "client_port")
          - delete_key(attributes["transaction"], "intermediary")
  batch:
    timeout: 2s
    send_batch_size: 512
exporters:
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 300s
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 300s
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: false
service:
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/jaeger]
    logs:
      receivers: [file_log, file_log/edge, file_log/edge_audit, otlp]
      processors: [memory_limiter, transform/edge_audit_privacy, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
