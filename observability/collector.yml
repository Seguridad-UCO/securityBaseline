extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  file_log:
    include: [/var/log/security/*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes["@timestamp"]
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
        severity:
          parse_from: attributes.level
      - type: move
        from: attributes["service.name"]
        to: resource["service.name"]
      - type: move
        from: attributes["deployment.environment.name"]
        to: resource["deployment.environment.name"]
      - type: trace_parser
        if: 'attributes.traceId != nil and attributes.traceId != ""'
        trace_id:
          parse_from: attributes.traceId
        span_id:
          parse_from: attributes.spanId
  prometheus:
    config:
      scrape_configs:
        - job_name: security-pdp
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${env:PDP_METRICS_TARGET}"]
        - job_name: security-pep
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${env:PEP_METRICS_TARGET}"]
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(status.message, "")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  batch:
    timeout: 2s
    send_batch_size: 512
exporters:
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 300s
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 300s
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: false
service:
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/jaeger]
    logs:
      receivers: [file_log, otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
