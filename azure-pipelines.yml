# Pipeline único para la línea base del PDP.
#
# Estrategia de ramas:
#
#   PR contra main → build + test + SonarQube (análisis de PR)   (sin despliegue)
#   push a main     → build + test + SonarQube (análisis de rama) → DEV + PRODUCTION
#
# DEV y QA eran ambientes separados gateados por sus propias ramas (`develop`, `qa`), pero en la
# práctica todo el trabajo fluye por PR contra `main` — esas ramas quedaban semanas sin un merge y
# los ambientes que gateaban se volvían obsoletos sin que nadie lo notara. Se unificaron en un solo
# ambiente no-prod (`DEV`) que dispara con el mismo push a `main` que ya dispara PRODUCTION: sirve
# como verificación previa siempre actualizada en vez de un segundo ambiente fantasma.
#
# Un solo pipeline y no uno por ambiente: la verificación debe ser idéntica en ambas rutas, y
# duplicar el YAML es precisamente cómo se logra que dejen de serlo. Lo único que cambia por
# ambiente es el archivo de variables y el objeto `environment` de Azure DevOps.
#
# El trigger de push ya no incluye `feature/*`: el plan de SonarQube Cloud de esta organización no
# analiza ramas distintas de main (solo main y pull requests), así que cada push a una feature branch
# terminaba en un pipeline rojo por diseño, no por un error real. La validación de esas ramas sigue
# ocurriendo — a través del bloque `pr:` de abajo, en cuanto se abre el pull request contra main.
#
# Ningún secreto aparece en este repositorio. Las credenciales llegan por service connection y por
# Azure Key Vault, ambas resueltas en tiempo de ejecución.

name: $(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

# Validación de pull request. Con GitHub como origen, esto es lo que publica el resultado del
# build de vuelta en el PR — es la única validación de CI que corre sobre una feature branch.
pr:
  branches:
    include:
      - main

variables:
  - template: ci/variables/common.yml

stages:
  - template: ci/templates/stage-build-analyze.yml

  - template: ci/templates/stage-deploy.yml
    parameters:
      stageName: DeployDev
      displayName: 'Despliegue a DEV'
      variableFile: dev.yml
      azureServiceConnectionName: 'Azure-PDP-Dev'
      condition: >-
        and(succeeded(),
            eq(variables['Build.SourceBranch'], 'refs/heads/main'),
            ne(variables['Build.Reason'], 'PullRequest'))

  # Depende de DeployDev, no solo de BuildAndAnalyze: si DEV no llega saludable, PRODUCCIÓN ni se
  # intenta. DEV deja de ser un ambiente aparte y pasa a ser el chequeo previo real de cada release.
  - template: ci/templates/stage-deploy.yml
    parameters:
      stageName: DeployProd
      displayName: 'Despliegue a PRODUCCIÓN'
      variableFile: prod.yml
      azureServiceConnectionName: 'Azure-PDP-Prod'
      dependsOn: DeployDev
      condition: >-
        and(succeeded(),
            eq(variables['Build.SourceBranch'], 'refs/heads/main'),
            ne(variables['Build.Reason'], 'PullRequest'))
