trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: JavaToolInstaller@0
  displayName: 'Seleccionar Temurin JDK 25'
  inputs:
    versionSpec: '25'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- bash: |
    set -euo pipefail
    java -version
    ./mvnw --version
    ./mvnw --batch-mode verify
  displayName: 'Compilar y verificar con Java 25'
