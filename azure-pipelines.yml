trigger:
- main

stages:
- stage: Build
  displayName: 'Compilación'
  jobs:
  - job: CompileApplication
    displayName: 'Compilar'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: JavaToolInstaller@0
      displayName: 'Configurar Java'
      inputs:
        versionSpec: '25'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - bash: |
        set -euo pipefail
        java -version
        ./mvnw --version
        ./mvnw --batch-mode -DskipTests package
      displayName: 'Compilar el proyecto'

- stage: UnitTests
  displayName: 'Pruebas unitarias'
  dependsOn: Build
  jobs:
  - job: RunUnitTests
    displayName: 'Pruebas unitarias'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: JavaToolInstaller@0
      displayName: 'Configurar Java'
      inputs:
        versionSpec: '25'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - bash: |
        set -euo pipefail
        java -version
        ./mvnw --batch-mode test
      displayName: 'Ejecutar pruebas unitarias'

    - task: PublishTestResults@2
      displayName: 'Publicar resultados JUnit'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true
