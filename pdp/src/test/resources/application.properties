# La aplicación local arranca con Keycloak por defecto. La suite mantiene su emisor HMAC y sus
# contenedores aislados; las pruebas que quieran Keycloak lo activan explícitamente.
spring.profiles.default=test
management.endpoints.web.exposure.include=health,info,metrics

# AbstractSurrealDbIntegrationTest replaces only the URL with the mapped Testcontainers port.
# These properties must still exist because a test-classpath application.properties shadows the
# production resource of the same name.
pdp.persistence.surrealdb.namespace=pdp
pdp.persistence.surrealdb.database=pdp
pdp.persistence.surrealdb.username=root
pdp.persistence.surrealdb.password=root

pdp.security.jwt.secret=dev-only-signing-key-not-for-production-use-please-change-1234
pdp.security.jwt.issuer=https://security-baseline.pdp.local
pdp.security.jwt.audience=security-baseline-pdp
pdp.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000
pdp.security.revocation.retention=PT1H
pdp.security.internal.mtls.enabled=false
pdp.security.internal.mtls.trust-certificate=
pdp.security.internal.mtls.allowed-subjects=
pdp.security.internal.evidence.jwk-set-uri=http://127.0.0.1:0/jwks
pdp.security.internal.evidence.issuer=https://internal-evidence.local
pdp.security.internal.evidence.audience=pdp-internal
pdp.security.internal.evidence.technical-client-id=security-pep-internal
pdp.cache.active-roles.retention=PT60S
pdp.identity.default-tenant-id=universidad-uco
pdp.frontend.origin=http://localhost:5173
pdp.security.login.allowed-return-origins=http://localhost:5174
pdp.security.session.secure-cookies=false
pdp.tenants.seed[tenant-a]=ACTIVE
pdp.tenants.seed[universidad-uco]=ACTIVE
pdp.tenants.seed[colegio-suspendido]=SUSPENDED
pdp.opa.base-url=http://localhost:8181
pdp.opa.decision-path=/v1/data/security/authorization/decision
pdp.opa.administration-decision-path=/v1/data/security/administration/decision
pdp.opa.timeout=2s
