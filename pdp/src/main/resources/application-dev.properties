# DEV. Activated by SPRING_PROFILES_ACTIVE=dev, set by the pipeline's deploy stage.
# Verbose on purpose: this is where the flow is debugged.

logging.level.co.edu.uco.seguridad=DEBUG
management.endpoints.web.exposure.include=health,info,metrics,env,loggers
management.endpoint.health.show-details=always

# Keycloak real (ADR-020), en su propia VM (rg-pdp-shared-v1) — mismo realm que PROD. El perfil
# 'keycloak' (activo junto a este, ver ci/variables/dev.yml) trae su propia configuración de
# pdp.security.jwt.* apuntando a PDP_KEYCLOAK_ISSUER; no se repite aquí para no tener dos fuentes
# de verdad.
pdp.frontend.origin=${PDP_FRONTEND_ORIGIN:}

pdp.persistence.surrealdb.url=${PDP_DATASOURCE_URL}
pdp.persistence.surrealdb.username=${PDP_DATASOURCE_USERNAME}
pdp.persistence.surrealdb.password=${PDP_DATASOURCE_PASSWORD}

pdp.persistence.surrealdb.namespace=pdp_dev
pdp.persistence.surrealdb.database=pdp_dev

# Sin frontend desplegado todavía (PD-12 pendiente): sin origen configurado, CORS no deja pasar
# ninguna llamada de navegador (ADR-022). Se fija apenas exista un frontend real que apuntar aquí.
pdp.security.cors.allowed-origins=${PDP_FRONTEND_ORIGIN:}
