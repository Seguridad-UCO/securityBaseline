# PRODUCTION. Activated by SPRING_PROFILES_ACTIVE=prod.
#
# Secrets are never written here. When a subsystem that needs one arrives, it is referenced by
# placeholder and the value is injected as an environment variable sourced from Azure Key Vault:
#
#   spring.datasource.password=${PDP_DATASOURCE_PASSWORD}
#
# See infra/README.md for the reserved secret names and how they are delivered.

logging.level.co.edu.uco.seguridad=INFO
logging.level.root=WARN

# Narrow surface: 'env' and 'loggers' would expose configuration and allow changing log levels
# at runtime.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Sample rather than trace everything, so telemetry cost stays proportional to traffic.
management.tracing.sampling.probability=0.1

# Keycloak real (ADR-020), misma VM/realm compartida con DEV (rg-pdp-shared-v1) — sin cupo de
# vCPU para una instancia dedicada a PROD. El perfil 'keycloak' (activo junto a este, ver
# ci/variables/prod.yml) trae su propia configuración de pdp.security.jwt.* apuntando a
# PDP_KEYCLOAK_ISSUER; no se repite aquí para no tener dos fuentes de verdad.
pdp.frontend.origin=${PDP_FRONTEND_ORIGIN:}

# SurrealDB real (ADR-0004): url/usuario son configuración operativa (ci/variables/prod.yml), la
# contraseña es el secreto reservado pdp-datasource-password (infra/README.md), sin valor de
# respaldo.
pdp.persistence.surrealdb.url=${PDP_DATASOURCE_URL}
pdp.persistence.surrealdb.username=${PDP_DATASOURCE_USERNAME}
pdp.persistence.surrealdb.password=${PDP_DATASOURCE_PASSWORD}

# Sin frontend desplegado todavía (PD-12 pendiente): sin origen configurado, CORS no deja pasar
# ninguna llamada de navegador (ADR-022). Se fija apenas exista un frontend real que apuntar aquí.
pdp.security.cors.allowed-origins=${PDP_FRONTEND_ORIGIN:}
