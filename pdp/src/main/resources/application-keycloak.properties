spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${PDP_KEYCLOAK_CLIENT_ID:security-baseline-bff}
spring.security.oauth2.client.registration.keycloak.client-secret=${PDP_KEYCLOAK_CLIENT_SECRET:TPoYOEY5rzn11VxWtCq5m0cv9mIbSeEM1Tf0CuOezPK6UXr1xT9mWhTiW1u84fJ9l8fU9iUT3GqPTT4wzwXkVW}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${PDP_KEYCLOAK_ISSUER:http://localhost:9090/realms/security-baseline}
# El PDP valida tokens RS256 de Keycloak, nunca el ID token emitido directamente por Google.
pdp.security.jwt.secret=
pdp.security.jwt.jwk-set-uri=${PDP_KEYCLOAK_ISSUER:http://localhost:9090/realms/security-baseline}/protocol/openid-connect/certs
pdp.security.jwt.issuer=${PDP_KEYCLOAK_ISSUER:http://localhost:9090/realms/security-baseline}
pdp.security.jwt.audience=${PDP_KEYCLOAK_BEARER_AUDIENCE:security-baseline-pdp}
pdp.security.internal.evidence.jwk-set-uri=${PDP_KEYCLOAK_ISSUER:http://localhost:9090/realms/security-baseline}/protocol/openid-connect/certs
pdp.security.internal.evidence.issuer=${PDP_KEYCLOAK_ISSUER:http://localhost:9090/realms/security-baseline}
pdp.security.internal.evidence.audience=${PDP_KEYCLOAK_CLIENT_ID:security-baseline-bff}
pdp.security.internal.evidence.technical-client-id=${PDP_INTERNAL_TECHNICAL_CLIENT_ID:security-pep-internal}
pdp.frontend.origin=${PDP_FRONTEND_ORIGIN:http://localhost:5173}
pdp.security.cors.allowed-origins=${PDP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
pdp.security.login.allowed-return-origins=${PDP_LOGIN_ALLOWED_RETURN_ORIGINS:http://localhost:5174}
pdp.security.session.secure-cookies=${PDP_SECURITY_SESSION_SECURE_COOKIES:false}
# Renovacion del token de la sesion BFF (HU-030): margen previo a la expiracion y tope de espera del canje.
pdp.security.session.token-renewal-skew=${PDP_SECURITY_SESSION_TOKEN_RENEWAL_SKEW:60s}
pdp.security.session.token-renewal-timeout=${PDP_SECURITY_SESSION_TOKEN_RENEWAL_TIMEOUT:5s}
# Cliente técnico con permiso de alta de clientes confidenciales M2M en Keycloak. En producción el
# secreto debe venir exclusivamente del gestor de secretos de la plataforma.
pdp.service-identities.keycloak.enabled=${PDP_SERVICE_IDENTITIES_KEYCLOAK_ENABLED:true}
pdp.service-identities.keycloak.base-url=${PDP_KEYCLOAK_ADMIN_URL:http://localhost:9090}
pdp.service-identities.keycloak.token-uri=${PDP_KEYCLOAK_ISSUER:http://localhost:9090/realms/security-baseline}/protocol/openid-connect/token
pdp.service-identities.keycloak.realm=${PDP_KEYCLOAK_REALM:security-baseline}
pdp.service-identities.keycloak.client-id=${PDP_KEYCLOAK_PROVISIONER_CLIENT_ID:security-pdp-provisioner}
pdp.service-identities.keycloak.client-secret=${PDP_KEYCLOAK_PROVISIONER_CLIENT_SECRET:change-me-in-production}
pdp.service-identities.keycloak.evidence-audience=${PDP_SERVICE_IDENTITIES_EVIDENCE_AUDIENCE:security-baseline-bff}
pdp.service-identities.keycloak.timeout=${PDP_SERVICE_IDENTITIES_KEYCLOAK_TIMEOUT:3s}
