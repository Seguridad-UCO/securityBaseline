spring.application.name=seguridad
spring.webflux.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=${TELEMETRY_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.enabled=false
spring.reactor.context-propagation=auto

logging.structured.format.console=logstash
logging.structured.json.add.service.name=${OTEL_SERVICE_NAME:security-pdp}
logging.structured.json.add.deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:local}
management.opentelemetry.resource-attributes.service.name=${OTEL_SERVICE_NAME:security-pdp}
management.opentelemetry.resource-attributes.deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:local}

# Tenant catalog, seeded into SurrealDB on startup (ADR-0004). Tenant identifiers are
# configuration, not secrets, so they belong here and never in Key Vault. 'colegio-suspendido' is
# seeded inactive so the tenant rule is demonstrable end to end.
pdp.tenants.seed[tenant-a]=ACTIVE
pdp.tenants.seed[universidad-uco]=ACTIVE
pdp.tenants.seed[colegio-suspendido]=SUSPENDED

# Names the platform keeps for itself; enforced by ApplicationNameMustNotBeReservedRule.
pdp.applications.reserved-names=admin,system,pdp,pep,keycloak

# Tenant asignado a un usuario nuevo en su primer login, antes de que un administrador lo reasigne.
pdp.identity.default-tenant-id=universidad-uco

# Emisor propio de JWT mientras no exista un IdP real para pruebas locales sin OIDC. 'secret' es
# un valor de desarrollo, nunca el que firma tokens reales: los ambientes desplegados lo
# sobrescriben desde una variable de entorno respaldada por Key Vault (ver
# application-prod.properties e infra/README.md).
pdp.security.jwt.secret=dev-only-signing-key-not-for-production-use-please-change-1234
pdp.security.jwt.issuer=https://security-baseline.pdp.local
pdp.security.jwt.audience=security-baseline-pdp
pdp.frontend.origin=${PDP_FRONTEND_ORIGIN:http://localhost:5173}
pdp.security.session.secure-cookies=${PDP_SECURITY_SESSION_SECURE_COOKIES:false}

# Conexión a SurrealDB (ADR-0004). Estos valores son para desarrollo local contra el contenedor
# descrito en docker-compose.yml — url/usuario/namespace/database no son secretos (ver
# infra/README.md); la contraseña sí lo es en dev/prod, donde este archivo se sobrescribe sin valor
# de respaldo.
pdp.persistence.surrealdb.url=http://localhost:8000
pdp.persistence.surrealdb.namespace=pdp
pdp.persistence.surrealdb.database=pdp
pdp.persistence.surrealdb.username=root
pdp.persistence.surrealdb.password=root

# Origen del SPA y lista CORS para desarrollo local. El perfil keycloak usa el origen exacto como
# redirección post-login; DEV/QA/PROD lo fijan por variable de entorno y nunca aceptan '*'.
pdp.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# Aplicaciones externas autorizadas a recuperar la URL original tras login. Es una allow-list,
# nunca un reflejo libre del parámetro return_to.
pdp.security.login.allowed-return-origins=http://localhost:5174

# Canal interno para el PEP (HU-003). Sin valores por defecto permisivos: una lista de sujetos vacía
# rechaza cualquier certificado (falla cerrado), y una URL JWKS que no resuelve nada hace que
# cualquier evidencia falle al validar en vez de aceptarse. server.ssl.* no se configura aquí a
# propósito — es configuración de despliegue por ambiente (ver HANDOFF-INTEGRACION-PEP-OPA.md §11),
# así que sin ella el canal interno no ofrece TLS y por tanto rechaza toda petición sin certificado.
# Local usa HTTP para facilitar la demostración. Los perfiles desplegados lo fuerzan a true.
pdp.security.internal.mtls.enabled=${PDP_INTERNAL_MTLS_ENABLED:false}
pdp.security.internal.mtls.trust-certificate=
pdp.security.internal.mtls.allowed-subjects=
pdp.security.internal.evidence.jwk-set-uri=http://127.0.0.1:0/jwks
pdp.security.internal.evidence.issuer=https://internal-evidence.local
pdp.security.internal.evidence.audience=pdp-internal

# Cliente OPA (HU-006, D10 del handoff PDP-PEP-OPA). En dev/local apunta al contenedor de
# security-policy-engine; sin políticas de aplicación publicadas, responde siempre NO_APPLICABLE_POLICY.
pdp.opa.base-url=http://localhost:8181
pdp.opa.decision-path=/v1/data/security/authorization/decision
# HU-009: mecanismo de administración por aplicación, sin política Rego real todavía (ver PLAN-HU-009.md §11).
pdp.opa.administration-decision-path=/v1/data/security/administration/decision
pdp.opa.timeout=2s

# Revocación de tokens (HU-022, ADR-026). El TTL de la clave de revocación excede el tiempo de vida
# máximo esperado de un access token de Keycloak — pasado ese tiempo, cualquier token anterior a la
# revocación ya habría expirado por sí solo, así que la clave deja de aportar.
spring.data.redis.host=${PDP_REDIS_HOST:localhost}
spring.data.redis.port=${PDP_REDIS_PORT:6379}
pdp.security.revocation.retention=PT1H
# El starter de Redis trae su propio indicador de salud de Actuator, que Boot habilita solo con la
# dependencia en el classpath — nadie lo pidió como criterio de aceptación de esta historia, y
# acoplar la salud general del servicio a si Redis responde no es una decisión tomada (el fail-closed
# de la revocación ya cubre el caso "Redis caído" donde de verdad importa, en el decoder, no aquí).
management.health.redis.enabled=false
