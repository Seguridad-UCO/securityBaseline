# Activación explícita: SPRING_PROFILES_ACTIVE=observability (o keycloak,observability).
management.server.port=${MANAGEMENT_SERVER_PORT:9080}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.opentelemetry.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.propagation.type=w3c
management.tracing.baggage.enabled=false
management.metrics.tags.service=${OTEL_SERVICE_NAME:security-pdp}
management.metrics.tags.environment=${DEPLOYMENT_ENVIRONMENT:local}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles-histogram.security.authorization=true
logging.structured.format.file=logstash
logging.file.name=${TELEMETRY_LOG_FILE:./observability/logs/security-pdp.json}
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
