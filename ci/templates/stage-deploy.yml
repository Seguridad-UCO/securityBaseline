# One parameterised deployment stage, instantiated once per environment.
#
# DEV, QA and PROD differ only in their variable file and their Azure DevOps environment, so they
# share this definition. Approvals are not expressed here: they are checks on the environment
# object, which is what keeps a YAML edit from removing a production gate.
parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: variableFile
    type: string
  - name: azureServiceConnectionName
    type: string
  - name: dependsOn
    type: string
    default: 'BuildAndAnalyze'
  - name: condition
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    variables:
      - template: ../variables/${{ parameters.variableFile }}
    jobs:
      - deployment: Deploy
        displayName: ${{ parameters.displayName }}
        pool:
          vmImage: ubuntu-latest
        environment: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs, unlike regular jobs, do not check out source by default —
                # without this, `az acr build .` below has no Dockerfile to find.
                - checkout: self

                # Secrets become masked pipeline variables named like the Key Vault secret
                # (e.g. pdp-datasource-password). They are never written to a file or the repo.
                # Filter only what a running environment actually consumes today — pdp-jwt-signing-key
                # (dev/prod are on JWKS now, ADR-020), pdp-oidc-client-secret and pdp-otlp-token (no
                # subsystem reads them yet) aren't referenced by any application-*.properties, and this
                # task fails hard if a filtered secret doesn't exist in the vault.
                - task: AzureKeyVault@2
                  displayName: 'Leer secretos desde Azure Key Vault'
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnectionName }}
                    KeyVaultName: $(keyVaultName)
                    SecretsFilter: 'pdp-datasource-password'

                # App Service runs the application as a container: Azure App Service's managed
                # Java runtime tops out at Java 21, and this project targets Java 25 (pom.xml).
                # Built on the agent itself with plain `docker build`/`push`, not `az acr build`
                # — ACR Tasks (the remote-build service `az acr build` depends on) is blocked
                # outright for this subscription ("TasksOperationsNotAllowed"), independent of any
                # role assignment. The image tag is the build id, not `latest` — App Service does
                # not repoll a mutable tag on its own, so a stable tag would leave the previous
                # version running until a manual restart.
                - task: AzureCLI@2
                  displayName: 'Construir y publicar imagen en Azure Container Registry'
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnectionName }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az acr login --name $(containerRegistryName)
                      docker build -t "$(containerRegistryName).azurecr.io/pdp:$(Build.BuildId)" .
                      docker push "$(containerRegistryName).azurecr.io/pdp:$(Build.BuildId)"

                - task: AzureCLI@2
                  displayName: 'Desplegar imagen en App Service'
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnectionName }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az webapp config container set \
                        --name $(webAppName) \
                        --resource-group $(resourceGroupName) \
                        --container-image-name "$(containerRegistryName).azurecr.io/pdp:$(Build.BuildId)"
                      az webapp config appsettings set \
                        --name $(webAppName) \
                        --resource-group $(resourceGroupName) \
                        --settings \
                          SPRING_PROFILES_ACTIVE=$(springProfile) \
                          PDP_IDP_ISSUER_URI=$(idpIssuerUri) \
                          PDP_IDP_JWK_SET_URI=$(idpJwkSetUri) \
                          PDP_DATASOURCE_URL=$(datasourceUrl) \
                          PDP_DATASOURCE_USERNAME=$(datasourceUsername) \
                          PDP_DATASOURCE_PASSWORD=$(pdp-datasource-password) \
                        --output none
                      az webapp restart --name $(webAppName) --resource-group $(resourceGroupName)

                # Fails the deployment if the application does not come back healthy, so a broken
                # release is visible here instead of on the next request.
                - bash: |
                    set -euo pipefail
                    for attempt in $(seq 1 30); do
                      status=$(curl -s -o /dev/null -w "%{http_code}" "https://$(webAppName).azurewebsites.net/actuator/health" || true)
                      if [ "$status" = "200" ]; then
                        echo "Aplicación saludable tras $attempt intento(s)."
                        exit 0
                      fi
                      echo "Intento $attempt: estado $status"
                      sleep 15
                    done
                    echo "La aplicación no respondió saludable."
                    echo "Comprueba: App Service existe, runtime del contenedor, y SurrealDB alcanzable en PDP_DATASOURCE_URL=$(datasourceUrl)"
                    exit 1
                  displayName: 'Verificar salud del despliegue'
