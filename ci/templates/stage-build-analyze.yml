# Build, test, static analysis and packaging.
#
# One job rather than three, on purpose: SonarQube needs the compiled classes, the surefire
# reports and the JaCoCo report to come from the same workspace. Splitting them would mean
# publishing and re-downloading the whole target directory to gain nothing.
stages:
  - stage: BuildAndAnalyze
    displayName: 'Construcción, pruebas y análisis'
    jobs:
      - job: Verify
        displayName: 'Compilar, probar y analizar'
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: steps-java-setup.yml

          # Prepares the scanner and injects the server URL and token from the service connection.
          # `sonar.qualitygate.wait=true` is what makes a failed gate fail the build instead of
          # only colouring the dashboard.
          #
          # sonar.coverage.jacoco.xmlReportPaths is deliberately NOT set here: the Azure Sonar
          # extension runs analysis through a separate, JRE-provisioned scanner engine process
          # (visible in the logs as its own Java runtime), and a relative path passed as an
          # extraProperty resolves against that process rather than the Maven basedir. Pipeline
          # properties also take precedence over pom.xml properties, so setting it here was
          # silently shadowing the pom.xml's absolute, always-correct
          # ${project.build.directory}-based path and breaking coverage detection.
          #
          # Branch vs PR: never set sonar.branch.name on a pull-request build. That property
          # disables PR detection and makes Sonar treat the run as a normal branch (often only
          # main is expected). GitHub hosts the PR; Azure only runs CI, so we pass the GitHub
          # pullrequest.* properties explicitly when Build.Reason is PullRequest.
          - bash: |
              set -euo pipefail
              if [ "$(Build.Reason)" = "PullRequest" ]; then
                src="$(System.PullRequest.SourceBranch)"
                base="$(System.PullRequest.TargetBranch)"
                src="${src#refs/heads/}"
                base="${base#refs/heads/}"
                echo "##vso[task.setvariable variable=sonarPrKey]$(System.PullRequest.PullRequestNumber)"
                echo "##vso[task.setvariable variable=sonarPrBranch]${src}"
                echo "##vso[task.setvariable variable=sonarPrBase]${base}"
                echo "Sonar PR analysis: key=$(System.PullRequest.PullRequestNumber) branch=${src} base=${base}"
              else
                echo "Sonar branch analysis: $(Build.SourceBranchName)"
              fi
            displayName: 'Resolver parámetros Sonar (branch vs PR)'

          - task: SonarQubePrepare@7
            displayName: 'Preparar análisis SonarQube (branch)'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              SonarQube: '$(sonarServiceConnection)'
              scannerMode: 'Other'
              extraProperties: |
                sonar.organization=seguridad-uco
                sonar.projectKey=Seguridad-UCO_securityBaseline
                sonar.projectName=Security Baseline PDP
                sonar.qualitygate.wait=true
                sonar.qualitygate.timeout=300
                sonar.branch.name=$(Build.SourceBranchName)
                sonar.coverage.exclusions=**/PdpApplication.java,**/*Configuration.java,**/package-info.java
                sonar.cpd.exclusions=**/*Test.java
                sonar.java.source=$(javaVersion)
                sonar.issue.ignore.multicriteria=e1
                sonar.issue.ignore.multicriteria.e1.ruleKey=java:S110
                sonar.issue.ignore.multicriteria.e1.resourceKey=*

          - task: SonarQubePrepare@7
            displayName: 'Preparar análisis SonarQube (pull request)'
            condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
            inputs:
              SonarQube: '$(sonarServiceConnection)'
              scannerMode: 'Other'
              extraProperties: |
                sonar.organization=seguridad-uco
                sonar.projectKey=Seguridad-UCO_securityBaseline
                sonar.projectName=Security Baseline PDP
                sonar.qualitygate.wait=true
                sonar.qualitygate.timeout=300
                sonar.pullrequest.key=$(sonarPrKey)
                sonar.pullrequest.branch=$(sonarPrBranch)
                sonar.pullrequest.base=$(sonarPrBase)
                sonar.pullrequest.provider=github
                sonar.pullrequest.github.repository=Seguridad-UCO/securityBaseline
                sonar.coverage.exclusions=**/PdpApplication.java,**/*Configuration.java,**/package-info.java
                sonar.cpd.exclusions=**/*Test.java
                sonar.java.source=$(javaVersion)
                sonar.issue.ignore.multicriteria=e1
                sonar.issue.ignore.multicriteria.e1.ruleKey=java:S110
                sonar.issue.ignore.multicriteria.e1.resourceKey=*

          # `verify` runs compile, tests and the JaCoCo XML report; sonar:sonar runs after and
          # imports target/site/jacoco/jacoco.xml via sonar.coverage.jacoco.xmlReportPaths in pom.xml.
          - task: Maven@4
            displayName: 'mvn verify + análisis SonarQube'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'verify'
              options: '$(mavenOptions)'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Pruebas unitarias e integración'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '$(javaVersion)'
              mavenVersionOption: 'Default'
              sonarQubeRunAnalysis: true
              isJacocoCoverageReportXML: true
              codeCoverageToolOption: 'JaCoCo'

          # Fails clearly if JaCoCo did not write the XML Sonar must import (common cause of the
          # "A few extra steps are needed for coverage" tile on SonarQube Cloud).
          - bash: |
              set -euo pipefail
              REPORT="$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml"
              if [[ ! -f "$REPORT" ]]; then
                echo "##vso[task.logissue type=error]No se encontró $REPORT. Sin este archivo SonarQube Cloud no muestra cobertura."
                exit 1
              fi
              echo "JaCoCo XML listo para Sonar: $REPORT ($(wc -c < "$REPORT") bytes)"
            displayName: 'Verificar jacoco.xml para Sonar'
            condition: succeededOrFailed()

          - task: SonarQubePublish@7
            displayName: 'Publicar resultado del Quality Gate'
            condition: succeededOrFailed()
            inputs:
              pollingTimeoutSec: '300'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/src/main/java'

          # Packaging is skipped on pull requests: a PR must be verified, never shipped.
          - bash: |
              set -euo pipefail
              ./mvnw $(mavenOptions) -DskipTests package
            displayName: 'Empaquetar artefacto'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          - task: CopyFiles@2
            displayName: 'Recolectar jar ejecutable'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              contents: 'target/*.jar'
              targetFolder: '$(Build.ArtifactStagingDirectory)'
              flattenFolders: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefacto'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: '$(artifactName)'
