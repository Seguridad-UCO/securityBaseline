# Build, test, static analysis and packaging.
#
# One job rather than three, on purpose: SonarQube Cloud needs the compiled classes, the surefire
# reports and the JaCoCo report to come from the same workspace. Splitting them would mean
# publishing and re-downloading the whole target directory to gain nothing.
stages:
  - stage: BuildAndAnalyze
    displayName: 'Construcción, pruebas y análisis'
    jobs:
      - job: Verify
        displayName: 'Compilar, probar y analizar'
        pool:
          vmImage: ubuntu-latest
        steps:
          # Azure defaults to a shallow clone (fetchDepth: 1). Sonar needs full SCM history
          # (blame / new code) and the PR target ref (e.g. main) for pull-request analysis.
          # persistCredentials: without it, Azure strips the injected auth right after checkout,
          # and the later `git fetch` of the PR base branch fails with "could not read Username
          # for 'https://github.com': terminal prompts disabled" against this private repo.
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - template: steps-java-setup.yml

          # SonarQube Cloud (not SonarQube Server): use SonarCloudPrepare/Publish from the
          # "SonarQube Cloud" Azure DevOps extension. SonarQubePrepare@7 against sonarcloud.io
          # often yields "Not authorized or project not found" when retrieving feature flags.
          #
          # sonar.coverage.jacoco.xmlReportPaths stays in pom.xml only (absolute via
          # ${project.build.directory}); do not set a relative path here.
          #
          # Branch vs PR: never set sonar.branch.name on a pull-request build.
          - bash: |
              set -euo pipefail
              if [ "$(Build.Reason)" = "PullRequest" ]; then
                src="$(System.PullRequest.SourceBranch)"
                base="$(System.PullRequest.TargetBranch)"
                src="${src#refs/heads/}"
                base="${base#refs/heads/}"
                # PR checkouts often lack refs/heads/<base>; Sonar needs that ref to compute new code.
                git fetch --no-tags origin "refs/heads/${base}:refs/remotes/origin/${base}"
                git fetch --no-tags origin "refs/heads/${base}:refs/heads/${base}"
                echo "##vso[task.setvariable variable=sonarPrKey]$(System.PullRequest.PullRequestNumber)"
                echo "##vso[task.setvariable variable=sonarPrBranch]${src}"
                echo "##vso[task.setvariable variable=sonarPrBase]${base}"
                echo "Sonar PR analysis: key=$(System.PullRequest.PullRequestNumber) branch=${src} base=${base}"
                git rev-parse --verify "refs/heads/${base}"
                git rev-parse --verify "refs/remotes/origin/${base}"
              else
                echo "Sonar branch analysis: $(Build.SourceBranchName)"
              fi
            displayName: 'Resolver parámetros Sonar (branch vs PR)'

          - task: SonarCloudPrepare@4
            displayName: 'Preparar análisis SonarCloud (branch)'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              SonarCloud: '$(sonarServiceConnection)'
              organization: 'seguridad-uco'
              scannerMode: 'other'
              extraProperties: |
                sonar.projectKey=Seguridad-UCO_securityBaseline
                sonar.projectName=Security Baseline PDP
                sonar.qualitygate.wait=true
                sonar.qualitygate.timeout=300
                sonar.branch.name=$(Build.SourceBranchName)
                sonar.coverage.exclusions=**/PdpApplication.java,**/*Configuration.java,**/package-info.java
                sonar.cpd.exclusions=**/*Test.java
                sonar.java.source=$(javaVersion)
                sonar.issue.ignore.multicriteria=e1
                sonar.issue.ignore.multicriteria.e1.ruleKey=java:S110
                sonar.issue.ignore.multicriteria.e1.resourceKey=*

          - task: SonarCloudPrepare@4
            displayName: 'Preparar análisis SonarCloud (pull request)'
            condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
            inputs:
              SonarCloud: '$(sonarServiceConnection)'
              organization: 'seguridad-uco'
              scannerMode: 'other'
              extraProperties: |
                sonar.projectKey=Seguridad-UCO_securityBaseline
                sonar.projectName=Security Baseline PDP
                sonar.qualitygate.wait=true
                sonar.qualitygate.timeout=300
                sonar.pullrequest.key=$(sonarPrKey)
                sonar.pullrequest.branch=$(sonarPrBranch)
                sonar.pullrequest.base=$(sonarPrBase)
                sonar.pullrequest.provider=github
                sonar.pullrequest.github.repository=Seguridad-UCO/securityBaseline
                sonar.coverage.exclusions=**/PdpApplication.java,**/*Configuration.java,**/package-info.java
                sonar.cpd.exclusions=**/*Test.java
                sonar.java.source=$(javaVersion)
                sonar.issue.ignore.multicriteria=e1
                sonar.issue.ignore.multicriteria.e1.ruleKey=java:S110
                sonar.issue.ignore.multicriteria.e1.resourceKey=*

          # JaCoCo already lives in pom.xml. Leaving codeCoverageToolOption=JaCoCo would inject a
          # second jacoco plugin (Maven duplicate warning) and Azure's coverage parser can fail
          # the task after a successful verify.
          - task: Maven@4
            displayName: 'mvn verify + análisis SonarCloud'
            inputs:
              mavenPomFile: 'pdp/pom.xml'
              goals: 'verify'
              options: '$(mavenOptions)'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Pruebas unitarias e integración'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '$(javaVersion)'
              mavenVersionOption: 'Default'
              sonarQubeRunAnalysis: true
              codeCoverageToolOption: 'None'

          - bash: |
              set -euo pipefail
              REPORT="$(System.DefaultWorkingDirectory)/pdp/target/site/jacoco/jacoco.xml"
              if [[ ! -f "$REPORT" ]]; then
                echo "##vso[task.logissue type=error]No se encontró $REPORT. Sin este archivo SonarQube Cloud no muestra cobertura."
                exit 1
              fi
              echo "JaCoCo XML listo para Sonar: $REPORT ($(wc -c < "$REPORT") bytes)"
            displayName: 'Verificar jacoco.xml para Sonar'
            condition: succeededOrFailed()

          - task: SonarCloudPublish@4
            displayName: 'Publicar resultado del Quality Gate'
            condition: succeededOrFailed()
            inputs:
              pollingTimeoutSec: '300'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/pdp/target/site/jacoco/jacoco.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/pdp/src/main/java'

          - bash: |
              set -euo pipefail
              ./mvnw -f pdp/pom.xml $(mavenOptions) -DskipTests package
            displayName: 'Empaquetar artefacto'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          - task: CopyFiles@2
            displayName: 'Recolectar jar ejecutable'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              contents: 'pdp/target/*.jar'
              targetFolder: '$(Build.ArtifactStagingDirectory)'
              flattenFolders: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefacto'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: '$(artifactName)'
