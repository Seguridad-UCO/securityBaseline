# DEV/QA unified environment. Fed by `main` — see azure-pipelines.yml header for why QA as a
# separate environment was retired.
variables:
  environmentName: 'pdp-dev'
  # NOTA: 'keycloak' se quitó temporalmente (ver commit de rollback) — el deploy stage todavía no
  # inyecta PDP_KEYCLOAK_ISSUER/CLIENT_ID/CLIENT_SECRET, así que con el perfil activo el contenedor
  # intenta resolver el issuer OIDC en http://localhost:9090 (el default de dev) y no arranca.
  springProfile: 'dev'
  azureServiceConnection: 'Azure-PDP-Dev'
  keyVaultName: 'kv-pdp-dev'
  webAppName: 'app-pdp-dev'
  resourceGroupName: 'rg-pdp-dev-v2'
  datasourceUrl: 'http://20.242.47.139:8000'
  datasourceUsername: 'root'
  # Keycloak real (ADR-020), en su propia VM (rg-pdp-shared-v1).
  idpIssuerUri: 'http://20.22.186.196:8080/realms/pdp'
  idpJwkSetUri: 'http://20.22.186.196:8080/realms/pdp/protocol/openid-connect/certs'
