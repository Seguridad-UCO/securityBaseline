# DEV/QA unified environment. Fed by `main` — see azure-pipelines.yml header for why QA as a
# separate environment was retired.
variables:
  environmentName: 'pdp-dev'
  springProfile: 'dev,keycloak'
  azureServiceConnection: 'Azure-PDP-Dev'
  keyVaultName: 'kv-pdp-dev'
  webAppName: 'app-pdp-dev'
  resourceGroupName: 'rg-pdp-dev-v2'
  datasourceUrl: 'http://20.242.47.139:8000'
  datasourceUsername: 'root'
  # Keycloak real (ADR-020), en su propia VM (rg-pdp-shared-v1), realm 'security-baseline' (mismo
  # nombre que el realm local, para que DEV/PROD y desarrollo local compartan una sola convención).
  keycloakIssuerUri: 'http://20.22.186.196:8080/realms/security-baseline'
  keycloakClientId: 'security-baseline-bff'
  # La VM de Keycloak se prende bajo demanda para ahorrar crédito de Azure — si este deploy falla
  # con "no se pudo resolver el issuer OIDC", prende la VM primero (az vm start -g rg-pdp-shared-v1
  # -n vm-pdp-keycloak-shared) y vuelve a correr el deploy.
