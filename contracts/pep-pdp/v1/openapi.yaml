openapi: 3.1.0
info:
  title: Security Platform — PEP/PDP
  version: 1.0.0
  description: |
    Contract implemented by the PEP client and PDP internal channel.
    Identity evidence is the original user Bearer token. mTLS authenticates the PEP service;
    a successful user authentication alone must not grant access to this internal operation.
    PDP resolves trusted identity, local tenant, resource, roles and profiles and delegates policies to OPA.
servers:
  - url: https://pdp.internal
security:
  - userEvidence: []
    pepIdentity: []
paths:
  /internal/v1/applications/{applicationId}/credential-validations:
    post:
      operationId: validateApplicationCredential
      summary: Validate the application credential used for PEP self-registration
      parameters:
        - in: path
          name: applicationId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: {type: string, minLength: 1}
      responses:
        '200':
          description: Credential is valid; tenant ID is returned only to the PEP.
          content:
            application/json:
              schema:
                type: object
                required: [tenantId]
                properties:
                  tenantId: {type: string}
        '400':
          description: Application does not exist or credential is invalid; PDP deliberately does not distinguish them.
        '401':
          description: PEP internal evidence JWT is invalid.
        '403':
          description: PEP mTLS identity is not admitted.
        '503':
          description: Credential validation is unavailable; PEP fails closed.
  /internal/v1/access-decisions:
    post:
      operationId: evaluateAccess
      summary: Evaluate one canonical access request
      parameters:
        - in: header
          name: X-Request-Id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: X-Correlation-Id
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './request.schema.json'}
            examples:
              request: {externalValue: './request.example.json'}
      responses:
        '200':
          description: |
            Completed evaluation; ALLOW, DENY or INDETERMINATE. IDs must match request body
            and headers. Only a valid ALLOW with no obligations may reach the protected application.
          content:
            application/json:
              schema: {$ref: './decision.schema.json'}
              examples:
                allow: {externalValue: './allow.example.json'}
                deny: {externalValue: './deny.example.json'}
                indeterminate: {externalValue: './indeterminate.example.json'}
        '400':
          description: Invalid request contract. PEP treats as integration failure (503 to caller).
        '401':
          description: User identity evidence invalid. PEP responds 401 without forwarding.
        '403':
          description: PEP service not admitted. Integration failure (503), not a user policy DENY.
        '503':
          description: Evaluation unavailable. PEP fails closed with 503.
components:
  securitySchemes:
    userEvidence:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pepIdentity:
      type: mutualTLS
