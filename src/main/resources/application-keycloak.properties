# Se activa con SPRING_PROFILES_ACTIVE=keycloak. Los secretos solo llegan por variables de entorno.
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${PDP_KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${PDP_KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${PDP_KEYCLOAK_ISSUER}

# El PDP valida tokens RS256 de Keycloak, nunca el ID token emitido directamente por Google.
pdp.security.jwt.secret=
pdp.security.jwt.jwk-set-uri=${PDP_KEYCLOAK_ISSUER}/protocol/openid-connect/certs
pdp.security.jwt.issuer=${PDP_KEYCLOAK_ISSUER}
pdp.security.jwt.audience=${PDP_KEYCLOAK_CLIENT_ID} 
pdp.security.session.secure-cookies=${PDP_SECURITY_SESSION_SECURE_COOKIES:false}
