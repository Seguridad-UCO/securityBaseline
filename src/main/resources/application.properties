spring.application.name=seguridad
spring.webflux.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=1.0

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p requestId=%X{requestId:-} correlationId=%X{correlationId:-} logger=%logger{36} message=%msg%n

# Tenant catalog, seeded into SurrealDB on startup (ADR-0004). Tenant identifiers are
# configuration, not secrets, so they belong here and never in Key Vault. 'colegio-suspendido' is
# seeded inactive so the tenant rule is demonstrable end to end.
pdp.tenants.seed[tenant-a]=ACTIVE
pdp.tenants.seed[universidad-uco]=ACTIVE
pdp.tenants.seed[colegio-suspendido]=SUSPENDED

# Names the platform keeps for itself; enforced by ApplicationNameMustNotBeReservedRule.
pdp.applications.reserved-names=admin,system,pdp,pep,keycloak

# Tenant asignado a un usuario nuevo en su primer login, antes de que un administrador lo reasigne.
pdp.identity.default-tenant-id=universidad-uco

# Emisor propio de JWT mientras no exista un IdP real para pruebas locales sin OIDC. 'secret' es
# un valor de desarrollo, nunca el que firma tokens reales: los ambientes desplegados lo
# sobrescriben desde una variable de entorno respaldada por Key Vault (ver
# application-prod.properties e infra/README.md).
pdp.security.jwt.secret=dev-only-signing-key-not-for-production-use-please-change-1234
pdp.security.jwt.issuer=https://security-baseline.pdp.local
pdp.security.jwt.audience=security-baseline-pdp
pdp.frontend.origin=${PDP_FRONTEND_ORIGIN:http://localhost:5173}
pdp.security.session.secure-cookies=${PDP_SECURITY_SESSION_SECURE_COOKIES:false}

# Conexión a SurrealDB (ADR-0004). Estos valores son para desarrollo local contra el contenedor
# descrito en docker-compose.yml — url/usuario/namespace/database no son secretos (ver
# infra/README.md); la contraseña sí lo es en dev/prod, donde este archivo se sobrescribe sin valor
# de respaldo.
pdp.persistence.surrealdb.url=http://localhost:8000
pdp.persistence.surrealdb.namespace=pdp
pdp.persistence.surrealdb.database=pdp
pdp.persistence.surrealdb.username=root
pdp.persistence.surrealdb.password=root

# Origen del SPA y lista CORS para desarrollo local. El perfil keycloak usa el origen exacto como
# redirección post-login; DEV/QA/PROD lo fijan por variable de entorno y nunca aceptan '*'.
pdp.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000
