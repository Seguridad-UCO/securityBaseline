# DEV. Activated by SPRING_PROFILES_ACTIVE=dev, set by the pipeline's deploy stage.
# Verbose on purpose: this is where the flow is debugged.

logging.level.co.edu.uco.seguridad=DEBUG
management.endpoints.web.exposure.include=health,info,metrics,env,loggers
management.endpoint.health.show-details=always

# Keycloak real (ADR-020), compartido con QA (misma VM, mismo realm — ambos ambientes son la misma
# verificación en la práctica, igual que la instancia compartida de SurrealDB en ADR-015). Vacía el
# 'secret' HMAC heredado de application.properties: los dos modos son mutuamente excluyentes.
pdp.security.jwt.secret=
pdp.security.jwt.jwk-set-uri=${PDP_IDP_JWK_SET_URI}
pdp.security.jwt.issuer=${PDP_IDP_ISSUER_URI}

pdp.persistence.surrealdb.url=${PDP_DATASOURCE_URL}
pdp.persistence.surrealdb.username=${PDP_DATASOURCE_USERNAME}
pdp.persistence.surrealdb.password=${PDP_DATASOURCE_PASSWORD}

# DEV and QA share one SurrealDB instance (see infra/README.md); a distinct namespace/database
# per environment is what keeps their data apart despite the shared instance.
pdp.persistence.surrealdb.namespace=pdp_dev
pdp.persistence.surrealdb.database=pdp_dev
