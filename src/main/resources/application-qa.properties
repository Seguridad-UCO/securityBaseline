# QA. Activated by SPRING_PROFILES_ACTIVE=qa.
# Mirrors production's exposure so what QA validates is what production will do.

logging.level.co.edu.uco.seguridad=INFO
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Keycloak real (ADR-020), compartido con DEV (misma VM, mismo realm). Vacía el 'secret' HMAC
# heredado de application.properties: los dos modos son mutuamente excluyentes.
pdp.security.jwt.secret=
pdp.security.jwt.jwk-set-uri=${PDP_IDP_JWK_SET_URI}
pdp.security.jwt.issuer=${PDP_IDP_ISSUER_URI}

# SurrealDB real (ADR-0004): url/usuario son configuración operativa (ci/variables/qa.yml), la
# contraseña es el secreto reservado pdp-datasource-password (infra/README.md), sin valor de
# respaldo — si falta, el arranque falla en vez de operar en silencio contra el valor de dev.
pdp.persistence.surrealdb.url=${PDP_DATASOURCE_URL}
pdp.persistence.surrealdb.username=${PDP_DATASOURCE_USERNAME}
pdp.persistence.surrealdb.password=${PDP_DATASOURCE_PASSWORD}

# DEV and QA share one SurrealDB instance (see infra/README.md); a distinct namespace/database
# per environment is what keeps their data apart despite the shared instance.
pdp.persistence.surrealdb.namespace=pdp_qa
pdp.persistence.surrealdb.database=pdp_qa
