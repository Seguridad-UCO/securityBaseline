spring.application.name=security-pep
management.tracing.sampling.probability=${TELEMETRY_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.enabled=false
spring.reactor.context-propagation=auto
logging.structured.format.console=logstash
logging.structured.json.add.service.name=${OTEL_SERVICE_NAME:security-pep}
logging.structured.json.add.deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:local}
management.opentelemetry.resource-attributes.service.name=${OTEL_SERVICE_NAME:security-pep}
management.opentelemetry.resource-attributes.deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:local}
# Configuración de desarrollo cargada automáticamente al ejecutar desde la raíz del repositorio.
# En despliegues, el archivo puede omitirse y se debe proporcionar la configuración propia del entorno.
spring.config.import=optional:file:./pep/config/local.properties
server.port=8081
server.max-http-request-header-size=16KB
server.forward-headers-strategy=none
spring.codec.max-in-memory-size=64KB
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,pdp
management.endpoint.health.group.liveness.include=livenessState
pep.ingress.allow-insecure-http=false
pep.ingress.max-concurrent=200
pep.ingress.requests-per-second=100
pep.ingress.burst=200
pep.ingress.max-rate-keys=10000
pep.ingress.max-body-bytes=10485760
pep.ingress.jwks-timeout=3s
pep.pdp.allow-insecure-http=false
pep.pdp.base-url=${PEP_PDP_BASE_URL:https://localhost:8080}
pep.pdp.connect-timeout=1s
pep.pdp.timeout=3s
pep.pdp.max-response-bytes=65536
pep.proxy.connect-timeout=2s
pep.proxy.timeout=30s
pep.proxy.max-body-bytes=${pep.ingress.max-body-bytes}
# The integration API is opt-in. When enabled, persist this file on a private volume.
pep.integration.enabled=false
pep.integration.registry-file=${PEP_INTEGRATION_REGISTRY_FILE:./pep-integrations.json}
# JWT del PEP para el canal interno PDP; solo se exige cuando pep.integration.enabled=true.
pep.integration.pdp-evidence-token=${PEP_INTEGRATION_PDP_EVIDENCE_TOKEN:}
# Transport libraries may include complete URIs in exception logs. PEP logs sanitized outcomes itself.
logging.level.reactor.netty.http.client=OFF
logging.level.reactor.netty.http.server=OFF
logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=OFF
