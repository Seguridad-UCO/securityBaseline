# Entorno local real: Keycloak, PDP y backend se comunican por HTTP solo para la demostración.
pep.ingress.allow-insecure-http=true
pep.ingress.issuer=http://localhost:9090/realms/security-baseline
pep.ingress.jwks-uri=http://localhost:9090/realms/security-baseline/protocol/openid-connect/certs
pep.ingress.allowed-origins[0]=http://localhost:5173
pep.pdp.allow-insecure-http=true
pep.pdp.base-url=http://localhost:8080
