# Fixture de fail-closed (PLAN-HU-027 §7.9 paso 6, criterio 4).
# Se monta sobre /etc/coraza/rules/99-broken.conf; Coraza debe rechazar la directiva y Caddy no
# debe arrancar. Si el edge pasa su healthcheck con este archivo cargado, el fail-closed no existe.
SecRule REQUEST_URI "@beginsWith /" "id:999999,phase:1,deny,status:403,this_is_not_an_action"
SecRuleEngine ThisModeDoesNotExist
