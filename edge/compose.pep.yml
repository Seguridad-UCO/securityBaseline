# Overlay del edge sobre la topología de integración del PEP.
#
#   docker compose -p edge-pep -f pep/compose.integration.yml -f edge/compose.pep.yml up -d --build --wait
#   docker compose -p edge-pep -f pep/compose.integration.yml -f edge/compose.pep.yml --profile test run --rm hurl
#
# Compose resuelve las rutas relativas desde pep/compose.integration.yml; por eso usan ../edge.
services:
  pep:
    ports: !reset []

  edge:
    build:
      context: ../edge
    image: security-edge:local
    container_name: edge-pep
    ports:
      - "8089:8088"
    environment:
      EDGE_MODE: ${EDGE_MODE:-detection}
      EDGE_UPSTREAM: http://pep:8081
      EDGE_LISTEN: ":8088"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
    volumes:
      - ${EDGE_HOST_LOG_DIR:-../observability/logs}:/var/log/security
    depends_on:
      pep:
        condition: service_started
    healthcheck:
      interval: ${EDGE_HEALTHCHECK_INTERVAL:-10s}
    networks:
      - protected
      - edge_clients
      - edge_metrics

  hurl:
    image: ghcr.io/orange-opensource/hurl:7.1.0
    profiles: ["test"]
    volumes:
      - ../edge/tests:/tests:ro
    working_dir: /tests
    entrypoint: ["hurl"]
    command: ["--version"]
    depends_on:
      edge:
        condition: service_healthy
    networks:
      - edge_clients

  hurl-second-ip:
    image: ghcr.io/orange-opensource/hurl:7.1.0
    profiles: ["test"]
    volumes:
      - ../edge/tests:/tests:ro
    working_dir: /tests
    entrypoint: ["hurl"]
    command: ["--version"]
    depends_on:
      edge:
        condition: service_healthy
    networks:
      - edge_clients

networks:
  protected:
    internal: true
  edge_clients: {}
  edge_metrics:
    external: true
    name: security-edge-metrics
