# Motor y cuerpos (PLAN-HU-027 §7.5). El modo (SecRuleEngine) NO va aquí: lo genera
# edge-entrypoint.sh desde EDGE_MODE en /etc/coraza/generated/00-engine.conf.
#
# Cuerpos de petición: se inspeccionan (sin esto el procesador JSON no ve nada). El límite es
# mayor que el del PEP (64 KB) a propósito — E9: el edge nunca es más estricto en tamaño que el
# backend, para no enmascarar el 413 que el backend ya sabe dar.
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject

# Cuerpos de respuesta: no se inspeccionan (API JSON; el costo no compensa en v1).
SecResponseBodyAccess Off

# Audit log JSON Lines. No incluir las partes B/C/D/E/F: contienen cabeceras (cookies y
# Authorization), cuerpos o respuestas. El log de acceso de Caddy conserva la correlación y el
# estado HTTP; la parte K conserva las reglas que dispararon sin copiar la petición completa.
# RelevantOnly se enciende explícitamente en la regla 100900 cuando una regla puntúa.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^[0-9]{4}$"
SecAuditLogParts AKZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/security/security-edge-audit.json
