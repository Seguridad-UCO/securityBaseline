# Enciende el audit log de la transacción si alguna regla puntuó (PLAN-HU-027 §7.8, criterio 2/5).
# Va DESPUÉS de todas las reglas de petición del CRS y ANTES de 949 (la evaluación de bloqueo):
# en blocking, 949110 interrumpe la fase y nada posterior correría; en detection, es la única forma
# de que una detección con estado 200 quede escrita (RelevantOnly en Coraza solo mira el estado).
# Excluye el healthcheck del contenedor (edge-healthcheck), que 100001 ya sacó del audit.
SecRule TX:INBOUND_ANOMALY_SCORE_PL1|TX:INBOUND_ANOMALY_SCORE_PL2|TX:INBOUND_ANOMALY_SCORE_PL3|TX:INBOUND_ANOMALY_SCORE_PL4 "@gt 0"     "id:100900,phase:2,pass,nolog,t:none,chain"
    SecRule REQUEST_HEADERS:X-Correlation-Id "!@rx ^edge-healthcheck"         "t:none,ctl:auditEngine=On,logdata:'anomaly_score=%{TX.INBOUND_ANOMALY_SCORE} path=%{REQUEST_FILENAME} correlationId=%{request_headers.x-correlation-id}'"
