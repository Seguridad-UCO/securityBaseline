# Enciende el audit log de la transacción si alguna regla puntuó (PLAN-HU-027 §7.8, criterio 2/5).
# Va DESPUÉS de todas las reglas de petición del CRS y ANTES de 949 (la evaluación de bloqueo):
# en blocking, 949110 interrumpe la fase y nada posterior correría; en detection, es la única forma
# de que una detección con estado 200 quede escrita (RelevantOnly en Coraza solo mira el estado).
# Excluye SOLO el latido de liveness (X-Correlation-Id exactamente "edge-healthcheck"), que 100001 ya
# sacó del audit. NO es un prefijo: el canario de detección del healthcheck usa
# "edge-healthcheck-detect" y DEBE auditarse (es la evidencia de que el motor detecta). Con el regex
# anterior `^edge-healthcheck` el canario quedaba excluido, el audit log nunca crecía y el healthcheck
# de EDGE_MODE=detection fallaba siempre (HU-027, hallazgo de la validación 2026-10-28).
#
# HU-034: la regla anterior NO entregaba nada al audit log. (1) Coraza registra una cadena con los
# metadatos (msg/logdata/log) de la CABEZA, y la cabeza llevaba `nolog`: ningun mensaje 100900 salia
# con datos. (2) TX.INBOUND_ANOMALY_SCORE no existe a esta altura (CRS lo calcula en 949060, despues);
# aqui solo existen tx.inbound_anomaly_score_pl1..pl4, que se suman en tx.edge_score. (3) Las acciones
# no disruptivas de la cabeza de una cadena se ejecutan aunque la hija no case: por eso
# ctl:auditEngine=On y los setvar van en la HIJA, y msg/logdata/log en la CABEZA.
# El colector (observability/collector.yml) localiza este mensaje por su msg constante 'edge-detection'
# y extrae de data.data: anomaly_score=<n> path=<ruta> correlationId=<id>. No se reintroduce la parte B.
SecRule REQUEST_HEADERS:X-Correlation-Id "!@streq edge-healthcheck"     "id:100900,phase:2,pass,log,t:none,msg:'edge-detection',logdata:'anomaly_score=%{TX.EDGE_SCORE} path=%{REQUEST_FILENAME} correlationId=%{REQUEST_HEADERS.x-correlation-id}',chain"
    SecRule TX:INBOUND_ANOMALY_SCORE_PL1|TX:INBOUND_ANOMALY_SCORE_PL2|TX:INBOUND_ANOMALY_SCORE_PL3|TX:INBOUND_ANOMALY_SCORE_PL4 "@gt 0"         "t:none,nolog,ctl:auditEngine=On,setvar:'tx.edge_score=+%{tx.inbound_anomaly_score_pl1}',setvar:'tx.edge_score=+%{tx.inbound_anomaly_score_pl2}',setvar:'tx.edge_score=+%{tx.inbound_anomaly_score_pl3}',setvar:'tx.edge_score=+%{tx.inbound_anomaly_score_pl4}'"
