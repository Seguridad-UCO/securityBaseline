# Reglas propias ANTES del CRS (ids 100000-199999). PLAN-HU-027 §7.5.

# El healthcheck del contenedor se identifica con X-Correlation-Id: edge-healthcheck. Sigue pasando
# por el motor (es lo que verifica), pero no debe quedar en el audit log como si fuera un ataque.
SecRule REQUEST_HEADERS:X-Correlation-Id "@streq edge-healthcheck" \
    "id:100001,phase:1,pass,nolog,noauditlog,ctl:auditEngine=Off"

# Rutas que nunca son legitimas en esta plataforma: puntuacion critica directa, sin esperar a que el
# CRS las evalue (930130 las cubriria igual; aqui quedan explicitas y con mensaje propio).
SecRule REQUEST_URI "@rx (?i)^/(\.env|\.git|\.svn|\.hg|\.DS_Store|wp-admin|wp-login\.php|xmlrpc\.php)" \
    "id:100010,phase:1,pass,log,auditlog,t:none,msg:'Ruta prohibida en la plataforma',severity:'CRITICAL',setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
