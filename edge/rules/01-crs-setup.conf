# crs-setup del edge (PLAN-HU-027 §7.5). Sustituye a @crs-setup.conf.example: solo lo que la
# plataforma fija. Paranoia y umbrales llegan por /etc/coraza/generated/01-tuning.conf (variables).
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Métodos permitidos (911100). TRACE, CONNECT, PROPFIND… quedan fuera.
SecAction \
 "id:900200,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  tag:'OWASP_CRS',\
  ver:'OWASP_CRS/4.0',\
  setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"

# Content-Type permitidos (920420): la API es JSON. El formulario de login de Keycloak NO pasa por
# el edge; el callback y el logout sí, pero sin cuerpo. form-urlencoded queda por si un cliente BFF
# lo usa; problem+json por simetría.
SecAction \
 "id:900220,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  tag:'OWASP_CRS',\
  ver:'OWASP_CRS/4.0',\
  setvar:'tx.allowed_request_content_type=|application/json| |application/problem+json| |application/x-www-form-urlencoded|'"

# Versión de setup exigida por el CRS.
SecAction \
 "id:900990,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  tag:'OWASP_CRS',\
  ver:'OWASP_CRS/4.0',\
  setvar:tx.crs_setup_version=400"
