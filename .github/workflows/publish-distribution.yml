name: Publish security distribution
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the immutable OPA policy bundle
        working-directory: security-policy-engine
        run: docker compose run --rm opa-tools ./scripts/bundle
      - uses: docker/bake-action@v6
        with:
          source: .
          push: true
          files: distribution/docker-bake.hcl
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - run: ./mvnw -f pep/starter/pom.xml -B -DskipTests -Drevision="${{ steps.version.outputs.value }}" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            distribution/compose.yaml
            distribution/.env.example
            distribution/README.md
            distribution/MANUAL.md
